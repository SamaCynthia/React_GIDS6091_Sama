name: My First Push
on:
  pull_request:

jobs:
  Tarea1:
    runs-on: ubuntu-22.04

    steps:
      - name: Desplegar datos del push (Origen)
        run: |
          echo "=== DATOS DEL PUSH ==="
          echo "Mensaje: ${{ github.event.pull_request.head.ref }}" # En PRs se suele usar la rama origen, para el mensaje exacto del último commit se requiere checkout, pero podemos extraer datos del contexto.
          echo "Autor: ${{ github.event.pull_request.user.login }}"
          echo "ID del Commit: ${{ github.event.pull_request.head.sha }}"
          echo "URL del Commit: https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}"
          echo "Rama origen: ${{ github.event.pull_request.head.ref }}"
          echo "Repositorio: ${{ github.repository }}"

      - name: Desplegar datos del Pull Request
        run: |
          echo "=== DATOS DEL PULL REQUEST ==="
          echo "Datos destino (Rama): ${{ github.event.pull_request.base.ref }}"
          echo "Datos origen (Rama): ${{ github.event.pull_request.head.ref }}"
          echo "Título: ${{ github.event.pull_request.title }}"
          echo "Contenido (Descripción): ${{ github.event.pull_request.body }}"
          echo "Estado: ${{ github.event.pull_request.state }}"
          echo "¿Ya fue fusionado?: ${{ github.event.pull_request.merged }}"
