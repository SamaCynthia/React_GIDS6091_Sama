name: Deploy to Vercel 
  
on: 
  push: 
    branches: 
      - main 
      - master 
  
jobs: 
  deploy: 
    name: Deploy to Vercel (Production) 
    runs-on: ubuntu-latest 

    # 1. Esto le dice a todos los comandos 'run' que se ejecuten dentro de tu carpeta de React
    defaults:
      run:
        working-directory: ./proyecto-react-sama
  
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
  
      - name: Setup Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: 20 
          cache: 'npm' 
          # 2. Le decimos a la caché exactamente dónde está el lockfile
          cache-dependency-path: ./proyecto-react-sama/package-lock.json
  
      - name: Install dependencies 
        run: npm ci 
  
      - name: Build project 
        run: npm run build 
  
      - name: Install Vercel CLI 
        run: npm install --global vercel@latest 
  
      - name: Pull Vercel environment info 
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} 
  
      - name: Build for Vercel 
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} 
  
      - name: Deploy to Vercel 
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
